<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>News Article | MA News 24</title>
<meta name="description" content="Read the latest news on MA News 24.">
<link rel="canonical" href="https://ma-news-24.pages.dev/news.html">
<meta property="og:type" content="article">
<meta property="og:site_name" content="MA News 24">
<meta property="og:title" content="News Article | MA News 24">
<meta property="og:description" content="Read the latest news on MA News 24.">
<meta property="og:url" content="https://ma-news-24.pages.dev/news.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b4bd6">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#101828;font:16px/1.7 Arial,sans-serif}.wrap{max-width:850px;margin:0 auto;padding:22px 18px}.brand{font-size:25px;font-weight:800;color:#0b4bd6;text-decoration:none}.back{display:inline-block;margin:20px 0;color:#0b4bd6;font-weight:700;text-decoration:none}.article{background:#fff;border:1px solid #dde3ee;border-radius:16px;padding:clamp(18px,4vw,34px)}.category{color:#0b4bd6;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.article h1{font-size:clamp(27px,5vw,42px);line-height:1.2;margin:10px 0 12px}.meta{color:#667085;font-size:14px}.hero{width:100%;max-height:480px;object-fit:cover;border-radius:12px;margin:22px 0}.body{font-size:18px;white-space:pre-wrap;overflow-wrap:anywhere}.share{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.share a,.share button{border:1px solid #d0d5dd;border-radius:8px;padding:10px 14px;background:#fff;color:#101828;text-decoration:none;font:inherit;cursor:pointer}.status{color:#667085;padding:30px 0}footer{color:#667085;font-size:13px;padding:24px 0}@media(max-width:560px){.wrap{padding:14px}.article{padding:18px}.body{font-size:16px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
<a class="brand" href="/">MA News 24</a>
<a class="back" href="/">← Back to all news</a>
<main id="article" class="article"><p class="status">News is loading…</p></main>
<footer>© 2026 MA News 24 · <a href="about.html">About Us</a> · <a href="contact.html">Contact Us</a></footer>
</div>
<script>
const SUPABASE_URL = "https://gmiwiorhkotptgjtyrmp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_WURwgOFhWX5dwRvOAD3pEw_jGK7kSHA";
const SITE = "https://ma-news-24.pages.dev/";
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function setMeta(name, content, attr='name') { let el=document.querySelector(`meta[${attr}="${name}"]`); if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}el.setAttribute('content',content); }
function setCanonical(url){let el=document.querySelector('link[rel="canonical"]');el.href=url;}
function showError(message){document.getElementById('article').innerHTML=`<p class="status">${esc(message)}</p><a class="back" href="/">Go to homepage</a>`;}
async function loadStory(){
 const id=new URLSearchParams(location.search).get('id');
 if(!id){showError('This news link is incomplete. Please open a story from the homepage.');return;}
 try{
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await client.from('news').select('id,category,title,description,image_url,created_at').eq('id',id).eq('status','published').maybeSingle();
  if(error)throw error;
  if(!data){showError('This news story is not available or has not been published.');return;}
  const storyUrl=SITE+'news.html?id='+encodeURIComponent(data.id);
  const title=(data.title||'News Article')+' | MA News 24';
  const description=String(data.description||'Read this latest news update on MA News 24.').replace(/\s+/g,' ').slice(0,155);
  document.title=title;setMeta('description',description);setCanonical(storyUrl);
  setMeta('og:title',title,'property');setMeta('og:description',description,'property');setMeta('og:url',storyUrl,'property');
  if(data.image_url)setMeta('og:image',data.image_url,'property');
  const date=data.created_at?new Date(data.created_at):null;
  const dateText=date&&!isNaN(date)?date.toLocaleString('en-IN'):'MA News 24';
  document.getElementById('article').innerHTML=`<div class="category">${esc(data.category||'News')}</div><h1>${esc(data.title)}</h1><div class="meta">MA News 24 · ${esc(dateText)}</div>${data.image_url?`<img class="hero" src="${esc(data.image_url)}" alt="${esc(data.title)}">`:''}<div class="body">${esc(data.description||'')}</div><div class="share"><a href="https://wa.me/?text=${encodeURIComponent(data.title+' - '+storyUrl)}" target="_blank" rel="noopener">Share on WhatsApp</a><a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(storyUrl)}" target="_blank" rel="noopener">Share on Facebook</a><button id="copyLink" type="button">Copy Link</button></div>`;
  document.getElementById('copyLink').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(storyUrl);document.getElementById('copyLink').textContent='Copied!';}catch(e){prompt('Copy this link:',storyUrl);}});
  const schema={"@context":"https://schema.org","@type":"NewsArticle","mainEntityOfPage":{"@type":"WebPage","@id":storyUrl},"headline":data.title,"description":description,"datePublished":data.created_at,"dateModified":data.created_at,"author":{"@type":"Organization","name":"MA News 24"},"publisher":{"@type":"Organization","name":"MA News 24"},"image":data.image_url?[data.image_url]:undefined};
  const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify(schema);document.head.appendChild(ld);
 }catch(error){console.error(error);showError('Could not load this story. Please try again later.');}
}
loadStory();
</script>
</body>
</html>
